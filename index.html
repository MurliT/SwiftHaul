<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C1B33" />
    <meta name="description" content="SwiftHaul Business Portal - Premium Last-Mile Logistics coordination tool for Kirana stores, Pharmacies, Bakers, and SME sellers in Indore." />
    <title>SwiftHaul Business Owner Portal</title>
  </head>
  <body class="bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('PWA Service Worker registered successfully:', reg.scope);
            })
            .catch(err => {
              console.error('PWA Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
